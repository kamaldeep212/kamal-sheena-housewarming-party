    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only

    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin

    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https

    // contexts such as a sandboxed preview iframe) — location.origin is

      // and sender identity (own child frame / direct parent) is checked
      // separately.

    const resourceBlobs = {};

        UUID_SHAPE.test(d.__bundler_page) &&

        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach

      ';</' + 'script>';

    // would push the parser into quirks mode. DOMParser always emits a <head>

    }

    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).

    document.documentElement.replaceWith(doc.documentElement);

    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.

      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');

      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;

    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }

display:flex;flex-direction:column;align-items:center;text-align:center\">\n      <div style=\"position:fixed;inset:0;z-index:3;pointer-events:none;overflow:hidden\">\n        <sc-for list=\"{{ shower }}\" as=\"p\" hint-placeholder-count=\"0\">\n          <span style=\"position:absolute;top:0;left:{{ p.left }};width:{{ p.size }};height:{{ p.size }};border-radius:50% 0 50% 50%;background:{{ p.color }};--sx:{{ p.sx }};--sr:{{ p.sr }};animation:shower {{ p.dur }} cubic-bezier(.35,.05,.6,1) {{ p.delay }} forwards\"><\u002Fspan>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"position:relative;width:100%;height:100px;pointer-events:none;transform-origin:50% 0;animation:lightsway 6.5s ease-in-out infinite\">\n        <svg sc-camel-view-box=\"0 -22 720 100\" sc-camel-preserve-aspect-ratio=\"none\" style=\"position:absolute;inset:0;width:100%;height:100%\">\n          <path d=\"M0 8 Q 90 70 180 20 T 360 24 T 540 18 T 720 10\" fill=\"none\" stroke=\"#9C8A5E\" stroke-width=\"1.6\"><\u002Fpath>\n        <\u002Fsvg>\n        <div style=\"position:absolute;left:14%;top:68px;width:13px;height:18px;border-radius:0 0 60% 60%;background:radial-gradient(circle at 50% 35%,#FFF0BE,#E8B94E);animation:bulb 3.1s ease-in-out -.2s infinite\"><\u002Fdiv>\n        <div style=\"position:absolute;left:34%;top:77px;width:13px;height:18px;border-radius:0 0 60% 60%;background:radial-gradient(circle at 50% 35%,#FFF0BE,#E8B94E);animation:bulb 2.7s ease-in-out -.9s infinite\"><\u002Fdiv>\n        <div style=\"position:absolute;left:54%;top:72px;width:13px;height:18px;border-radius:0 0 60% 60%;background:radial-gradient(circle at 50% 35%,#FFF0BE,#E8B94E);animation:bulb 3.4s ease-in-out -1.5s infinite\"><\u002Fdiv>\n        <div style=\"position:absolute;left:76%;top:64px;width:13px;height:18px;border-radius:0 0 60% 60%;background:radial-gradient(circle at 50% 35%,#FFF0BE,#E8B94E);animation:bulb 3s ease-in-out -1.2s infinite\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"position:relative;width:74px;height:74px;margin:4px 0 0;animation:seal .6s cubic-bezier(.34,1.4,.64,1) .1s both\">\n        <svg sc-camel-view-box=\"0 0 74 74\" width=\"74\" height=\"74\" fill=\"none\">\n          <circle cx=\"37\" cy=\"37\" r=\"33\" fill=\"#33452F\" stroke=\"#B18F45\" stroke-width=\"2\"><\u002Fcircle>\n          <circle cx=\"37\" cy=\"37\" r=\"26\" fill=\"none\" stroke=\"#D9B75F\" stroke-width=\"1\" stroke-dasharray=\"2 4\"><\u002Fcircle>\n          <path d=\"M22 38 L32 48 L53 25\" stroke=\"#F6F1E4\" stroke-width=\"4.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-dasharray=\"45\" stroke-dashoffset=\"45\" style=\"animation:drawtick .55s ease .5s forwards\"><\u002Fpath>\n        <\u002Fsvg>\n      <\u002Fdiv>\n      <h2 style=\"margin:14px 0 0;font:400 clamp(48px,9vw,92px)/1.05 'Great Vibes',cursive;color:#33452F;animation:rise .9s cubic-bezier(.2,.7,.2,1) .5s both\">Thank you<\u002Fh2>\n      <span style=\"display:block;width:150px;height:1px;margin:24px 0 18px;background:linear-gradient(90deg,transparent,#B18F45,transparent);animation:widen .9s ease .8s both\"><\u002Fspan>\n      <p style=\"margin:0;max-width:34ch;font:400 clamp(18px,2.6vw,22px)/1.6 'Cormorant Garamond',Georgia,serif;color:#4A5945;text-wrap:pretty;animation:rise .9s cubic-bezier(.2,.7,.2,1) .7s both\">We’re very excited to see you. Your presence will make this evening truly special. We can’t wait to welcome you, share beautiful moments, and celebrate together.<\u002Fp>\n\n      <div style=\"position:relative;margin:36px 0 0;padding:6px\">\n        <div style=\"position:absolute;inset:0;border:1px solid #C7B279;border-radius:12px;animation:framedraw .8s ease .9s both\"><\u002Fdiv>\n        <div style=\"position:relative;display:flex;align-items:center;gap:20px;padding:16px 26px;border:1px solid #E0D2AB;border-radius:8px;background:rgba(255,253,246,.72);animation:rise .8s cubic-bezier(.2,.7,.2,1) 1.6s both\">\n          <svg sc-camel-view-box=\"0 0 34 34\" width=\"48\" height=\"48\" fill=\"none\" stroke=\"#33452F\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n            <rect x=\"3\" y=\"6\" width=\"28\" height=\"25\" rx=\"4\"><\u002Frect>\n            <path d=\"M10 2.5v6M24 2.5v6\"><\u002Fpath>\n            <g fill=\"#33452F\" stroke=\"none\">\n              <rect x=\"8.5\" y=\"13\" width=\"3.4\" height=\"3.4\" rx=\".7\"><\u002Frect>\n              <rect x=\"15.3\" y=\"13\" width=\"3.4\" height=\"3.4\" rx=\".7\"><\u002Frect>\n              <rect x=\"22.1\" y=\"13\" width=\"3.4\" height=\"3.4\" rx=\".7\"><\u002Frect>\n              <rect x=\"8.5\" y=\"19\" width=\"3.4\" height=\"3.4\" rx=\".7\"><\u002Frect>\n              <rect x=\"15.3\" y=\"19\" width=\"3.4\" height=\"3.4\" rx=\".7\"><\u002Frect>\n              <rect x=\"8.5\" y=\"25\" width=\"3.4\" height=\"3.4\" rx=\".7\"><\u002Frect>\n            <\u002Fg>\n            <path d=\"M23.9 27.2c-2.6-1.7-4.1-3-4.1-4.6a2 2 0 0 1 4.1-.9 2 2 0 0 1 4.1.9c0 1.6-1.5 2.9-4.1 4.6z\"><\u002Fpath>\n          <\u002Fsvg>\n          <span style=\"width:1px;align-self:stretch;background:repeating-linear-gradient(180deg,#D8C79A 0 3px,transparent 3px 7px)\"><\u002Fspan>\n          <div style=\"display:flex;flex-direction:column;align-items:center;gap:8px\">\n            <span style=\"font:500 11px/1 Manrope,system-ui,sans-serif;letter-spacing:.3em;text-transform:uppercase;color:#6E8264\">Saturday<\u002Fspan>\n            <span style=\"font:600 clamp(19px,2.7vw,28px)/1.1 'Cormorant Garamond',Georgia,serif;letter-spacing:.16em;color:#33452F;white-space:nowrap\">12<sup style=\"font-size:.62em;letter-spacing:.1em\">TH<\u002Fsup> SEPTEMBER 2026<\u002Fspan>\n            <span style=\"font:500 clamp(15px,2.2vw,21px)/1.1 'Cormorant Garamond',Georgia,serif;letter-spacing:.22em;color:#B18F45\">4 PM ONWARDS<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <span style=\"position:relative;display:inline-block;margin:34px 0 0\">\n        <span style=\"display:block;font:400 clamp(26px,4.6vw,42px)/1.25 'Great Vibes',cursive;color:#33452F;animation:penreveal 2s cubic-bezier(.5,.05,.5,.95) 2.4s both\">See you on the 12th<\u002Fspan>\n        <span style=\"position:absolute;bottom:12%;width:9px;height:9px;border-radius:50%;background:#D9B75F;box-shadow:0 0 12px 3px rgba(217,183,95,.5);animation:nibmove 2s cubic-bezier(.5,.05,.5,.95) 2.4s both\"><\u002Fspan>\n      <\u002Fspan>\n      <p style=\"margin:10px 0 0;font:500 11px/1 Manrope,system-ui,sans-serif;letter-spacing:.3em;text-transform:uppercase;color:#6E8264\">— Kamal &amp; Sheena<\u002Fp>\n\n      <button sc-camel-on-click=\"{{ backToInvite }}\" style=\"margin:40px 0 0;display:inline-flex;align-items:center;gap:10px;padding:16px 30px;border-radius:999px;border:1px solid #B18F45;background:#FFFDF6;color:#6B5119;cursor:pointer;font:600 12px/1 Manrope,system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;transition:transform .25s ease,background .25s ease,box-shadow .25s ease\" style-hover=\"transform:translateY(-3px);background:#F3ECD8;box-shadow:0 16px 30px -18px rgba(107,81,25,.7)\">\n        <svg sc-camel-view-box=\"0 0 20 12\" width=\"18\" height=\"12\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M19 6H2\"><\u002Fpath><path d=\"M7 1.5 2 6l5 4.5\"><\u002Fpath><\u002Fsvg>\n        Back to the invite\n      <\u002Fbutton>\n    <\u002Fsection>\n  <\u002Fsc-if>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { night:false, door:false, copied:false, petals:[], celebrated:false, thanks:false };\n\n  componentWillUnmount(){ clearTimeout(this._c); clearTimeout(this._p); }\n\n  chime() {\n    try {\n      const AC = window.AudioContext || window.webkitAudioContext;\n      if (!AC) return;\n      this._ac = this._ac || new AC();\n      const ac = this._ac;\n      if (ac.state === \"suspended\") ac.resume();\n      const note = (freq, at, dur) => {\n        [1, 2.01, 3.04].forEach((mult, i) => {\n          const o = ac.createOscillator(), g = ac.createGain();\n          o.type = \"sine\";\n          o.frequency.value = freq * mult;\n          const peak = 0.34 / (i + 1.6);\n          g.gain.setValueAtTime(0.0001, ac.currentTime + at);\n          g.gain.exponentialRampToValueAtTime(peak, ac.currentTime + at + 0.012);\n          g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + at + dur);\n          o.connect(g).connect(ac.destination);\n          o.start(ac.currentTime + at);\n          o.stop(ac.currentTime + at + dur + 0.05);\n        });\n      };\n      note(659.25, 0, 1.5);\n      note(523.25, 0.42, 2.1);\n    } catch (err) {}\n  }\n\n  burst() {\n    const colors = [\"#B18F45\",\"#8FA783\",\"#D9B75F\",\"#5C7355\",\"#E0CFA2\"];\n    const petals = Array.from({length:26}, (_,i) => {\n      const a = Math.random()*Math.PI*2, r = 90 + Math.random()*170;\n      return { id: Date.now()+\"-\"+i, color: colors[i%colors.length],\n        dx: Math.round(Math.cos(a)*r)+\"px\", dy: Math.round(Math.sin(a)*r - 40)+\"px\" };\n    });\n    this.setState({ petals });\n    clearTimeout(this._p);\n    this._p = setTimeout(() => this.setState({ petals: [] }), 1600);\n  }\n\n  showerPetals() {\n    if (this._shower) return this._shower;\n    const colors = [\"#D9B75F\", \"#B7C7AC\", \"#E0CFA2\", \"#A9BE9E\", \"#C7B279\", \"#EBD9A8\"];\n    this._shower = Array.from({ length: 34 }, (_, i) => ({\n      left: (2 + Math.random() * 96).toFixed(1) + \"%\",\n      size: (7 + Math.random() * 6).toFixed(1) + \"px\",\n      color: colors[i % colors.length],\n      sx: (Math.random() * 160 - 80).toFixed(0) + \"px\",\n      sr: (200 + Math.random() * 320).toFixed(0) + \"deg\",\n      dur: (4.2 + Math.random() * 3).toFixed(2) + \"s\",\n      delay: (Math.random() * 2.4).toFixed(2) + \"s\"\n    }));\n    return this._shower;\n  }\n\n  renderVals() {\n    return {\n      nightOpacity: this.state.night ? 0.42 : 0,\n      nightLabel: this.state.night ? \"Daylight\" : \"Evening\",\n      toggleNight: () => this.setState(s => ({ night: !s.night })),\n      doorTransform: this.state.door ? \"rotateY(-90deg)\" : \"rotateY(0deg)\",\n      doorHint: this.state.door ? \"Come on in\" : \"Tap the bell to ring or knock the door to open it\",\n      bellRing1: this.state.door ? \"none\" : \"knobring 2.4s ease-out infinite\",\n      bellRing2: this.state.door ? \"none\" : \"knobring 2.4s ease-out 1.2s infinite\",\n      bellGlow: this.state.door ? \"none\" : \"bellglow 2.4s ease-in-out infinite\",\n      ringBell: (e) => {\n        if (e && e.stopPropagation) e.stopPropagation();\n        this.chime();\n        this.setState({ door: true });\n      },\n      knockAnim: this.state.door ? \"none\" : \"knock 3.4s ease-in-out infinite\",\n      tapOpacity: this.state.door ? 0 : 1,\n      toggleDoor: () => {\n        if (!this.state.door) this.chime();\n        this.setState(s => ({ door: !s.door }));\n      },\n      showMain: !this.state.thanks,\n      showThanks: this.state.thanks,\n      shower: this.state.thanks ? this.showerPetals() : [],\n      backToInvite: () => { this.setState({ thanks: false, celebrated: false }); window.scrollTo(0, 0); },\n      copyLabel: this.state.copied ? \"Address copied\" : \"Copy address\",\n      copyHome: () => {\n        const t = \"12134, Block G2, SBP City of Dreams 5, Sector 127, Mohali\";\n        if (navigator.clipboard) navigator.clipboard.writeText(t).catch(()=>{});\n        this.setState({ copied: true });\n        clearTimeout(this._c);\n        this._c = setTimeout(() => this.setState({ copied: false }), 2200);\n      },\n      petals: this.state.petals,\n      celebrateLabel: this.state.celebrated ? \"See you on the 12th\" : \"Count me in\",\n      celebrate: (e) => { if (e && e.preventDefault) e.preventDefault(); this.setState({ celebrated: true }); this.burst(); this.setState({ thanks: true }); window.scrollTo(0, 0); },\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
